name: Build and Release App

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v2.1.3

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and commit to gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - name: Verify Build
        run: ls -l build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ steps.version.outputs.VERSION }}
          body: "New update version ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Generate version.json
        run: |
          mkdir public
          echo '{' > public/version.json
          echo '  "version": "${{ steps.version.outputs.VERSION }}",' >> public/version.json
          echo '  "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk",' >> public/version.json
          echo '  "changelog": "Update to version ${{ steps.version.outputs.VERSION }}"' >> public/version.json
          echo '}' >> public/version.json

      - name: Deploy version.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
